server:
  port: ${SERVER_PORT:8761}
  shutdown: graceful

spring:
  application:
    name: discovery-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  security:
    user:
      name: ${DISCOVERY_USERNAME:discovery_admin}
      password: ${DISCOVERY_PASSWORD:change-me}
      roles: DISCOVERY,OPS

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    metadata-map:
      zone: ${EUREKA_ZONE:default}
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${DISCOVERY_USERNAME:discovery_admin}:${DISCOVERY_PASSWORD:change-me}@${EUREKA_INSTANCE_HOSTNAME:localhost}:${SERVER_PORT:8761}/eureka/
  server:
    enable-self-preservation: true
    eviction-interval-timer-in-ms: 60000
    renewal-percent-threshold: 0.85

logging:
  level:
    root: INFO
    com.netflix.eureka: INFO
    com.netflix.discovery: WARN
